<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AstroVive</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="av-body">
<div class="av-stage"><div class="av-phone">
  <div class="av-island"></div>
  <div class="av-status"><span id="clk">00:00</span>
    <span class="av-sys">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 5a11 11 0 0 1 15 0M4 8a7.5 7.5 0 0 1 10 0M6.6 11a3.8 3.8 0 0 1 4.8 0"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="#fff" stroke-width="1.4"><rect x="1" y="1" width="17" height="10" rx="3"/><rect x="19.5" y="4" width="2" height="4" rx="1" fill="#fff" stroke="none"/></svg>
    </span></div>

  <div class="av-brand">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#3cc8ff" stroke-width="2" stroke-linecap="round"><ellipse cx="16" cy="16" rx="13" ry="5.5" transform="rotate(-32 16 16)"/><circle cx="16" cy="16" r="6.2" fill="#0a2a6e"/></svg>
    <h1>AstroVive</h1></div>
  

  <svg class="av-astro" viewBox="0 0 240 180" aria-hidden="true">
    <defs>
      <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#9fb2d6" stop-opacity="0"/><stop offset="1" stop-color="#9fb2d6" stop-opacity=".55"/></linearGradient>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c8ea"/></linearGradient>
      <linearGradient id="vz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d56c9"/><stop offset="1" stop-color="#0a1b55"/></linearGradient>
      <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3cc8ff" stop-opacity=".35"/><stop offset="1" stop-color="#3cc8ff" stop-opacity="0"/></radialGradient>
    </defs>
    <circle cx="140" cy="86" r="80" fill="url(#gl)"/>
    <polygon points="20,112 98,96 98,116" fill="url(#sk)"/>
    <g transform="rotate(14 140 90)">
      <rect x="112" y="76" width="22" height="46" rx="10" fill="#8ea3cf"/>
      <rect x="126" y="62" width="32" height="30" rx="12" fill="url(#sw)" transform="rotate(-4 142 77)"/>
      <rect x="120" y="82" width="52" height="54" rx="22" fill="url(#sw)"/>
      <rect x="136" y="100" width="22" height="13" rx="4" fill="#142a66"/>
      <circle cx="143" cy="106.5" r="2.4" fill="#ff5a4f"/><circle cx="151" cy="106.5" r="2.4" fill="#ff9a3c"/>
      <rect x="164" y="86" width="16" height="36" rx="8" fill="url(#sw)" transform="rotate(-22 172 104)"/>
      <rect x="104" y="92" width="16" height="34" rx="8" fill="url(#sw)" transform="rotate(24 112 109)"/>
      <rect x="128" y="126" width="17" height="38" rx="8.5" fill="url(#sw)" transform="rotate(8 136 145)"/>
      <rect x="148" y="128" width="17" height="38" rx="8.5" fill="url(#sw)" transform="rotate(-10 156 147)"/>
      <rect x="127" y="152" width="19" height="13" rx="6" fill="#dbe4f7" transform="rotate(8 136 158)"/>
      <rect x="147" y="153" width="19" height="13" rx="6" fill="#dbe4f7" transform="rotate(-10 156 159)"/>
    </g>
    <g transform="rotate(8 150 52)">
      <circle cx="150" cy="52" r="38" fill="url(#sw)"/>
      <ellipse cx="152" cy="52" rx="27" ry="22" fill="url(#vz)"/>
      <ellipse cx="143" cy="44" rx="11" ry="6" fill="#fff" opacity=".45" transform="rotate(-25 143 44)"/>
      <circle cx="113" cy="52" r="4" fill="#cbd7f1"/><circle cx="187" cy="52" r="4" fill="#cbd7f1"/>
    </g>
    <circle cx="48" cy="26" r="1.8" fill="#9fc1ff"/><circle cx="214" cy="48" r="1.8" fill="#9fc1ff"/>
    <circle cx="36" cy="132" r="1.6" fill="#9fc1ff"/><circle cx="222" cy="136" r="2.2" fill="#9fc1ff" opacity=".7"/>
  </svg>

  <section class="av-card">
    <p class="av-err" id="err">{{err}}</p>

    <form class="av-view on" id="v1" action="/login" method="post">
      <h2>Board the Space Station</h2>
      <label class="av-f"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        <input name="crew" list="crew-list" placeholder="Astronaut name" autocomplete="username" required></label>
      <datalist id="crew-list">{% for c in crew %}<option value="{{c}}">{% endfor %}</datalist>
      <label class="av-f"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>
        <input type="password" name="pin" placeholder="Cabin access code" autocomplete="current-password" required></label>
      <button class="av-btn">Initiate launch <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      {% if show('join_mission') %}<button type="button" class="av-btn ghost" onclick="s('v2')">Join mission</button>{% endif %}
      {% if show('forgot_code') %}<div class="av-link" onclick="s('v3')">Forgot access code?</div>{% endif %}
    </form>

    <form class="av-view" id="v2" action="/register" method="post" onsubmit="return chk(this)">
      <h2>Enlist for the space mission</h2>
      <label class="av-f"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><input name="crew" placeholder="Astronaut full name" required></label>
      <label class="av-f"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 10h5M7 14h3"/></svg><input name="astronaut_id" maxlength="24" placeholder="Astronaut ID code (optional)"></label>
      <label class="av-f"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg><input type="email" name="email" maxlength="80" placeholder="Email (optional)"></label>
      <label class="av-f"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg><input type="password" name="pin" minlength="4" placeholder="Cabin access code" required></label>
      <label class="av-f"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg><input type="password" id="pin2" placeholder="Repeat access code"></label>
      <button class="av-btn">Join mission <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button type="button" class="av-btn ghost" onclick="s('v1')">Back to launch</button>
    </form>

    <form class="av-view" id="v3" onsubmit="event.preventDefault();document.getElementById('err').style.color='#7dd3fc';document.getElementById('err').textContent='Code sent (offline simulation).'">
      <h2>Lost your access code?</h2>
      <p class="av-hint">Enter your email to receive a new code.</p>
      <label class="av-f"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg><input type="email" placeholder="Email" required></label>
      <button class="av-btn">Send code <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="av-link" onclick="s('v1')">Back</div>
    </form>
  </section>

  
</div></div>
<script>
function s(i){document.querySelectorAll('.av-view').forEach(e=>e.classList.toggle('on',e.id==i));var r=document.getElementById('err');r.textContent='';r.style.color=''}
function chk(f){var p=f.querySelector('[name=pin]').value,q=document.getElementById('pin2').value;if(q&&p!==q){var r=document.getElementById('err');r.style.color='';r.textContent='Access codes do not match.';return false}return true}
function tick(){var d=new Date();document.getElementById('clk').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,15000);
</script></body></html>
